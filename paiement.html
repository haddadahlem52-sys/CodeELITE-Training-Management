<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement</title>
<script src="paiement.js"></script>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f1ea; /* beige comme inscription */
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* carte formulaire */
.form {
    width: 420px;
    background: #ffffff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #eee;
}

/* inputs & select */
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fafafa;
    font-size: 14px;
    transition: 0.3s;
}

/* focus */
input:focus, select:focus {
    border-color: #000;
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
}
.valider {
    background: #111;
    color: #fff;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.valider:hover {
    background: #333;
    transform: translateY(-2px);
}

.retour {
    background: #e6e6e6;
    color: #111;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.retour:hover {
    background: #ccc;
    transform: translateY(-2px);}
</style>

</head>
<body>

<div class="form">

<h2>Paiement</h2>

<select id="type">
    <option value="">Type de carte</option>
    <option>Carte nationale</option>
    <option>E-dinar</option>
    <option>Carte internationale</option>
</select>
<p id="errType" class="error"></p>

<input id="cin" placeholder="CIN (8 chiffres)">
<p id="errCin" class="error"></p>

<input id="nom" placeholder="Nom titulaire">
<p id="errNom" class="error"></p>

<input id="carte" placeholder="Numéro carte (16 chiffres)" maxlength="16">
<p id="errCarte" class="error"></p>

<input id="cvv" type="password" placeholder="Code sécurité (4 chiffres)" maxlength="4">
<p id="errCvv" class="error"></p>

<button class="valider" onclick="payer()">Valider paiement</button>
<a href="inscription2.html">
    <button class="retour">Retour</button>
</a>
<p id="message" class="success"></p>

</div>

<script src="paiement.js"></script>

</body>
</html>
