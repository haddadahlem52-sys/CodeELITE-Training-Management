<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion des Salles</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

/* ===== BODY ===== */
body {
    background: #f8f6f0;
    font-family: Arial, sans-serif;
}

/* ===== HEADER ===== */
header {
    background: #000;
    border-radius: 12px;
    margin: 20px;
}

header h1 {
    color: #fff;
}

header a {
    color: #f4f2ed;
    margin: 0 10px;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 20px;
    transition: 0.3s;
}

header a:hover {
    background: #3e2c23;
    color: #fff;
}

/* ===== CARD ===== */
.card {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

/* ===== CARD HEADER ===== */
.card-header {
    background: #000000;
    color: #fff;
    font-weight: bold;
}

/* ===== FORM ===== */
form {
    background: #efede8;
    padding: 20px;
    border-radius: 10px;
}

/* INPUTS */
.form-control {
    border-radius: 6px;
    border: 1px solid #d6cfc2;
}

.form-control:focus {
    border-color: #3e2c23;
    box-shadow: 0 0 5px rgba(62,44,35,0.3);
}

/* ===== BUTTONS ===== */
form button {
    margin-top: 20px;
    padding: 5px 5px;
    background-color: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}

form button:hover {
    background-color: #3e2c23;
}

/* Bootstrap override */
.btn-success {
    background-color: #000 !important;
    border: none;
}

.btn-success:hover {
    background-color: #3e2c23 !important;
}

.btn-secondary {
    background-color: #d6cfc2 !important;
    color: #000;
    border: none;
}

/* ===== FOOTER ===== */
footer {
    background: #000;
    color: #f5f1e6;
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="p-3">
  <div class="container d-flex justify-content-between align-items-center">
    <nav>
      <a href="index2.html">Home</a>
      <a href="service.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="gestion_salle.html"><b>Salles</b></a>
    </nav>
  </div>
</header>

<!-- MAIN -->
<main class="container">

  <section class="mb-5">
    <div class="card shadow-sm">
      
      <div class="card-header">
        Ajouter / Modifier une salle
      </div>

      <div class="card-body">
        <form id="salleForm" action="ajouter.php" method="POST">

          <div class="mb-3">
            <label class="form-label">Réference de la salle</label>
            <input type="text" name="ref" class="form-control" placeholder="Ex:4000" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Nom de la salle</label>
            <input type="text" name="nom" class="form-control" placeholder="Ex: Salle A1" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Capacité</label>
            <input type="number" name="capacite" class="form-control" min="1" placeholder="Ex: 30" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Type</label>
            <select name="type" class="form-control" required>
              <option value="">Choisir</option>
              <option value="informatique">Informatique</option>
              <option value="conference">Conférence</option>
              <option value="classique">Classique</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Statut</label>
            <select name="dispo" class="form-control">
              <option value="Disponible">Disponible</option>
              <option value="Indisponible">Indisponible</option>
            </select>
          </div>

          <button type="submit" class="btn btn-success me-2">
            <i class="fas fa-save"></i> Enregistrer
          </button>

          <button type="reset" class="btn btn-secondary">
            <i class="fas fa-times"></i> Annuler
          </button>

        </form>
      </div>

    </div>
  </section>

</main>

<!-- FOOTER -->
<footer class="text-center p-3 mt-5">
  &copy; 2026 EmpowerTech Training Center
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
