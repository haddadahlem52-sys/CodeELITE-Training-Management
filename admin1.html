        function changerPage(selectElement) {

            }
        }
    </script>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <h2>Forma Up</h2>

        <select onchange="changerPage(this)">

            <option value="gestionFormateur.html">Ajouter</option>
            <option value="supprimer_formateur.php">Supprimer</option>
        </select>

        <select onchange="changerPage(this)">
            <option value="">-- Salles --</option>
            <option value="gestion_salle.html">Ajouter</option>

            <option value="supprimer_salle.php">Supprimer</option>
            <option value="recherche.html">Rechercher</option>
        </select>

        <select onchange="changerPage(this)">

            <option value="activer.php">Désactiver</option>
            <option value="consulter.php">Consulter</option>
        </select>

        <select onchange="changerPage(this)">
            <option value="">-- Formations --</option>
            <option value="ajouterF.html">Ajouter</option>
            <option value="modifierF.php">Modifier</option>

</div>

</html>
